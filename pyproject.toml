[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finframe"
version = "2.0.0"
description = "Desktop MaxN video annotation, verified dataset accumulation, and assisted fish tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "PySide6>=6.7,<7",
  "ultralytics>=8.3.237,<9",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
finframe = "finframe.application:main"

[tool.setuptools.packages.find]
include = ["finframe*"]
