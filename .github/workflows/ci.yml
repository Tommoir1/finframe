name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff numpy opencv-contrib-python-headless PySide6
      - run: python -m ruff check finframe tests finframe_launcher.py
      - run: python -m compileall -q finframe finframe_launcher.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -c "import json, pathlib; json.loads(pathlib.Path('schemas/finframe-project.schema.json').read_text())"
